<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>小手机</title>
<script>
  /*
   * 版本号从 iframe 地址的 ?v= 拿来，给下面所有资源加在 URL 上。
   *
   * 为什么必须这么做：ES module 和 CSS 都会走浏览器缓存，光给 index.html
   * 带 ?v= 不够 —— html 里 <script src="phone.js"> 的路径没变，浏览器
   * 照样用旧的 phone.js，再连带旧的 apps.js 和 App 模块。
   * 症状就是"改了代码、刷新了页面，界面还是老样子"。
   */
  window.__MP_V = new URLSearchParams(location.search).get('v') || '';
  document.write('<link rel="stylesheet" href="theme.css?v=' + encodeURIComponent(window.__MP_V) + '">');
</script>
</head>
<body data-theme="dark" data-layer="lock">
<div class="phone">
  <div class="statusbar">
    <span id="status-time">--:--</span>
    <span class="status-right"><span class="signal">•••</span><span class="battery">100%</span></span>
  </div>

  <main id="screen" class="screen">

    <!-- 锁屏 -->
    <section id="layer-lock" class="layer layer-lock active">
      <div class="lock-clock">
        <b id="lock-time">--:--</b>
        <span id="lock-date"></span>
      </div>
      <div class="lock-hint">轻触进入</div>
    </section>

    <!-- 桌面 -->
    <section id="layer-home" class="layer layer-home">
      <p id="home-who" class="home-who"></p>
      <div id="home-grid" class="home-grid"></div>
    </section>

    <!-- App -->
    <section id="layer-app" class="layer layer-app">
      <header class="app-bar">
        <button id="btn-back" class="app-back hidden" type="button" aria-label="返回">‹</button>
        <h1 id="app-title"></h1>
        <span class="app-actions"></span>
      </header>
      <div id="app-host" class="app-host"></div>
    </section>

  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<script type="module">
  const s = document.createElement('script');
  s.type = 'module';
  s.src = 'phone.js?v=' + encodeURIComponent(window.__MP_V || '');
  document.body.append(s);
</script>
</body>
</html>
